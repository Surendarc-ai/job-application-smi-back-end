AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: job-application-smi-back-end (Express on Lambda)
Parameters:
  MongoDbUri:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas connection string
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret
  ClientOrigin:
    Type: String
    Description: Frontend URL (comma-separated for multiple origins)
    Default: https://your-frontend.vercel.app
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
    - arm64
Resources:
  JobAppApi:
    Type: AWS::Serverless::HttpApi
  JobAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.handler
      CodeUri: JobAppFunction
      Description: Job Application SMI Express API
      Environment:
        Variables:
          MONGODB_URI:
            Ref: MongoDbUri
          JWT_SECRET:
            Ref: JwtSecret
          CLIENT_ORIGIN:
            Ref: ClientOrigin
          MONGODB_TIMEOUT_MS: '30000'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: JobAppApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: JobAppApi
            Path: /
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - lambda.js
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: false
        Target: es2022
      SamResourceId: JobAppFunction
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${JobAppApi}.execute-api.${AWS::Region}.amazonaws.com
  HealthCheck:
    Description: Health check URL
    Value:
      Fn::Sub: https://${JobAppApi}.execute-api.${AWS::Region}.amazonaws.com/api/health
